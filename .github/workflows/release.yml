name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name'
        required: true
        type: string
      bump_version:
        description: 'Bump version'
        default: true
        type: boolean

permissions:
  contents: write

env:
  PROJECT: Source/O2JamPatchServer/O2JamPatchServer.csproj
  PROGRAM: Source/O2JamPatchServer/Program.cs

jobs:
  bump_version:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.revision.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Bump server version
        shell: bash
        env:
          ENABLED: ${{ inputs.bump_version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$ENABLED" != "true" ]]; then
            echo "Version bump disabled"
            exit 0
          fi

          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::warning::Tag '$TAG' is not a valid System.Version; skipping version bump"
            exit 0
          fi

          IFS='.' read -ra COMPONENTS <<< "$VERSION"
          NORMALIZED=()
          for COMPONENT in "${COMPONENTS[@]}"; do
            COMPONENT="${COMPONENT#"${COMPONENT%%[!0]*}"}"
            COMPONENT="${COMPONENT:-0}"
            if (( ${#COMPONENT} > 10 )) || \
               { (( ${#COMPONENT} == 10 )) && [[ "$COMPONENT" > "2147483647" ]]; }; then
              echo "::warning::Tag '$TAG' is not a valid System.Version; skipping version bump"
              exit 0
            fi
            NORMALIZED+=("$COMPONENT")
          done

          printf -v VERSION '%s.' "${NORMALIZED[@]}"
          VERSION="${VERSION%.}"
          printf -v ARGUMENTS '%s, ' "${NORMALIZED[@]}"
          ARGUMENTS="${ARGUMENTS%, }"

          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Version bumps must be dispatched from a branch"
            exit 1
          fi

          PATTERN='^[[:space:]]*public static Version Version[[:space:]]*=>[[:space:]]*new\([^)]*\);[[:space:]]*$'
          MATCHES=$(grep -Ec "$PATTERN" "$PROGRAM" || true)
          if [[ "$MATCHES" -ne 1 ]]; then
            echo "::error::Expected one Program.Version declaration in '$PROGRAM'"
            exit 1
          fi

          sed -E -i "s|^([[:space:]]*public static Version Version[[:space:]]*=>[[:space:]]*new\\()[^)]*(\\);[[:space:]]*)$|\\1$ARGUMENTS\\2|" "$PROGRAM"

          git diff --check -- "$PROGRAM"
          git add -- "$PROGRAM"

          if git diff --cached --quiet; then
            echo "Server version is already $VERSION"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump version: $VERSION"
          git push

      - name: Resolve build revision
        id: revision
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          VERSION=$(sed -n -E 's|^[[:space:]]*public static Version Version[[:space:]]*=>[[:space:]]*new\(([^)]*)\);.*|\1|p' "$PROGRAM" | tr -d ' ' | tr ',' '.')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to parse Program.Version from '$PROGRAM'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: bump_version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: win-x86
            os: windows-latest
            platform: x86
          - rid: linux-x64
            os: ubuntu-latest
            platform: x64
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump_version.outputs.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve assembly
        id: project
        shell: bash
        run: |
          ASSEMBLY=$(sed -n 's|.*<AssemblyName>\([^<]*\)</AssemblyName>.*|\1|p' "$PROJECT" | head -1)
          echo "assembly=$ASSEMBLY" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:Platform=${{ matrix.platform }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -o publish

      - name: Verify and package
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$PROJECT")
          ASSEMBLY="${{ steps.project.outputs.assembly }}"
          RID="${{ matrix.rid }}"
          VERSION="${{ needs.bump_version.outputs.version }}"

          # Determine executable name
          if [[ "$RID" == win-* ]]; then
            EXE="${ASSEMBLY}.exe"
          else
            EXE="${ASSEMBLY}"
          fi

          # Prepare staging directory
          mkdir -p staging

          # Copy executable from publish output
          if [ ! -f "publish/$EXE" ]; then
            echo "::error::Executable $EXE not found in publish output"
            ls -la publish/
            exit 1
          fi
          cp "publish/$EXE" staging/

          # Copy PreserveNewest content files if they exist
          PRESERVE_FILES=$(grep -B1 'PreserveNewest' "$PROJECT" | sed -n 's/.*Update="\([^"]*\)".*/\1/p' || true)
          for f in $PRESERVE_FILES; do
            if [ -f "$PROJECT_DIR/$f" ]; then
              cp "$PROJECT_DIR/$f" staging/
            fi
          done

          # Copy README.md without the centered image block
          sed '/<p align="center">/,/<\/p>/d' README.md | cat -s > staging/README.md

          echo "Package contents:"
          ls -1 staging

          # Create zip
          cd staging
          7z a -tzip "$GITHUB_WORKSPACE/${ASSEMBLY}-${RID}-${VERSION}.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.project.outputs.assembly }}-${{ matrix.rid }}-${{ needs.bump_version.outputs.version }}
          path: ${{ steps.project.outputs.assembly }}-${{ matrix.rid }}-${{ needs.bump_version.outputs.version }}.zip

  release:
    needs: [build, bump_version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Check tag availability
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ inputs.tag }}"
          if gh api "repos/$GH_REPO/git/refs/tags/$TAG" --silent 2>/dev/null; then
            echo "::warning::Tag '$TAG' already exists. Consider deleting the existing tag or using a different tag name."
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ inputs.tag }}"
          gh release create "$TAG" \
            --draft \
            --title "Draft Release $TAG" \
            --target "${{ needs.bump_version.outputs.sha }}" \
            --generate-notes \
            artifacts/*.zip
