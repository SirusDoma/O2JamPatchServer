[Server]
; TCP server address and port
Address=127.0.0.1
Port=15050

; Maximum incoming TCP connections and buffer size
MaxConnections=1000
PacketBufferSize=4096

[Patch]
; Patch FTP address and path
Address=127.0.0.1
Path=O2Jam/

; Manifest file path, relative to `Path`
; {GameVersion} is the installed game version: {GameVersion} writes 3.58, {GameVersion:D3} writes 358
; Old O2Jam:   Patch/PatchInfo/FileList_{GameVersion:D3}.dat
; Newer O2Jam: PatchInfo/FileList_{GameVersion:D3}.dat
Manifest=Patch/PatchInfo/FileList_{GameVersion:D3}.dat

; Launcher, patcher and music list directory, relative to `Path`
; Old O2Jam:   Patch/
; Newer O2Jam: O2JamPatch/
Patch=Patch/

; Game patch archive directory, relative to `Path`
; Old O2Jam:   Patch/
; Newer O2Jam: O2JamPatch/Patch/
Archive=Patch/

; Patch versions
GameVersion=3.58
PatchClientVersion=1.35
LauncherVersion=1.06
MusicListVersion=1.65

; Clients below this version require a full installation (optional)
; MinimumGameVersion=

; O2Jam Gateway sever table
; The section index ([Gateway:index]) should always start from 0 with no gap.
[Gateway:0]
Address=127.0.0.1
Port=15010

[Music]
; Music FTP address, port and path
; Old O2Jam:   The patcher updates charts from `Address`:`Port` in [Patch] `Path` + /Patch/MUSIC/, ignoring `Path`
; Newer O2Jam: The game downloads music from `Path`/O2JamMusic/ on its own servers, ignoring `Address` and `Port`
Address=127.0.0.1
Port=21
Path=/

[Ftp]
; FTP server address and port
Address=127.0.0.1
Port=21

; Maximum incoming FTP connections
MaxConnections=1000

; FTP root directory
; Path could be relative or absolute
Root=Public/

; FTP greeting message
Greeting=Service ready for new user

; Passive mode address and port range (optional)
; PassiveAddress=
; PassivePortMin=50000
; PassivePortMax=50100

; FTPS mode
; None     - Plain FTP only (default)
; Explicit - Plain FTP, secured when the client requests AUTH TLS
; Implicit - FTPS only
Tls=None

; FTPS certificate (.pfx, or .pem with `CertificateKey`)
; Certificate=
; CertificateKey=
; CertificatePassword=
